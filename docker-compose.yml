services:
  postgres:
    image: postgres:16-alpine
    container_name: taphoa-fpt-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taphoa_fpt
    volumes:
      - taphoa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taphoa_fpt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taphoa_pgdata:
